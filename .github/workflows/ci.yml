name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STEAM_API: ${{secrets.STEAM_API}}
      OPENDOTA_API_KEY: ${{secrets.OPENDOTA_API}}
      MODEL_ENDPOINT: ${{vars.MODEL_ENDPOINT}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install workspace dependencies
      run: poetry install --no-interaction

    - name: Run linting
      run: |
        poetry run ruff check .
        poetry run black --check .

    - name: Run type checking
      run: |
        # Non blocking checks for typing
        poetry run mypy . --show-error-codes --ignore-missing-imports || true

    - name: Run unit tests
      run: |
        poetry run pytest tests/unit_test/ -v --tb=short

    - name: Run integration tests
      run: |
        poetry run pytest tests/integration/ -v --tb=short

    - name: Run contract tests
      run: |
        poetry run pytest tests/contract/ -v --tb=short -m "not slow"

    - name: Run E2E tests
      run: |
        poetry run pytest tests/end_to_end/ -v -tb=short -m "e2e"
