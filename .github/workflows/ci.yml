name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      STEAM_API: ${{secrets.STEAM_API}}
      OPENDOTA_API: ${{secrets.OPENDOTA_API}}
      MODEL_ENDPOINT: ${{vars.MODEL_ENDPOINT}}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.12'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install project
      run: poetry install --no-interaction --only-root

    - name: Run linting
      run: |
        poetry run ruff check .
        git ls-files -z '*.py' ':!model_factory/notebook/**' | xargs -0 -r .venv/bin/black --check --quiet

    - name: Cache mypy results
      uses: actions/cache@v4
      with:
        path: .mypy_cache
        key: mypy-${{ runner.os }}-${{ hashFiles('**/*.py') }}
        restore-keys: mypy-${{ runner.os }}-

    - name: Run type checking
      timeout-minutes: 5
      continue-on-error: true
      run: |
        # Non blocking checks for typing
        poetry run mypy . --show-error-codes --ignore-missing-imports

    - name: Run unit tests
      run: |
        poetry run pytest tests/unit_test/ -v --tb=short

    - name: Run integration tests
      run: |
        poetry run pytest tests/integration/ -v --tb=short

    - name: Run contract tests
      run: |
        poetry run pytest tests/contract/ -v --tb=short -m "not slow"

    - name: Run E2E tests
      run: |
        poetry run pytest tests/end_to_end/ -v --tb=short -m "e2e"

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend checks
      working-directory: frontend
      run: |
        npm run lint
        npx tsc --noEmit
        npm run build

  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/projects/dota2pred' }}

    steps:
    - name: Configure SSH
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

    - name: Restart Docker Compose stack
      run: |
        ssh -p "$DEPLOY_PORT" -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE_SCRIPT'
        set -euo pipefail
        cd "$DEPLOY_PATH"
        git fetch origin main
        git checkout main
        git pull --ff-only origin main
        docker compose up -d --build --remove-orphans
        docker compose ps
        REMOTE_SCRIPT
