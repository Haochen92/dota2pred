[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "live_orchestrator_app"
version = "0.1.0"
description = "Main pipeline orchestration service for Dota Oracle"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]
packages = [{include = "*", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
dota-oracle-common = {path = "../packages/dota_oracle_common", develop = true}
dota-oracle-pipeline = {path = "../packages/dota_oracle_pipeline", develop = true}
prefect = ">=3.0"
prefect-aws = "*"
prefect-sqlalchemy = "*"
prefect-github = "*"
dependency-injector = "*"
redis = "*"
requests = "*"
aiohttp = "*"
tenacity = "^9.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
pytest-asyncio = "^0.26.0"
testcontainers = {extras = ["postgres", "redis"], version = "^4.10.0"}
mypy = "*"
