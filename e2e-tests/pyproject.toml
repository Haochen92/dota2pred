[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "e2e-tests"
version = "0.1.0"
description = "End-to-end tests for Dota Oracle microservices"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]

[tool.poetry.dependencies]
python = "3.11.12"
pytest = "*"
pytest-asyncio = "^0.26.0"
testcontainers = {extras = ["postgres", "redis"], version = "^4.10.0"}
httpx = "*"
requests = "*"

[tool.poetry.group.dev.dependencies]
pytest-mock = "*"
mypy = "*"