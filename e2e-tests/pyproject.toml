[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "e2e-tests"
version = "0.1.0"
description = "End-to-end tests for Dota Oracle microservices"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "3.11.12"
pytest = "*"
pytest-asyncio = "^0.26.0"
testcontainers = {extras = ["postgres", "redis"], version = "^4.10.0"}
httpx = "*"
requests = "*"
polyfactory = "^2.21.0"
sqlalchemy = "^2.0.41"
sqlmodel = "^0.0.24"
psycopg2-binary = "^2.9.10"
redis = "^6.2.0"
aioredis = "^2.0.1"
asyncpg = "^0.30.0"
alembic = "^1.16.1"
dota-oracle-common = {path = "../packages/dota_oracle_common", develop = true}
dota-oracle-etl = {path = "../packages/dota_oracle_etl", develop = true}
live-orchestrator-app = {path = "../live_orchestrator_app", develop = true}

[tool.poetry.group.dev.dependencies]
pytest-mock = "*"
mypy = "*"