[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dota-oracle-common"
version = "0.1.0"
description = "Common data models and repository layer for Dota Oracle"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]
packages = [{include = "dota_oracle_common", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
sqlmodel = "*"
sqlalchemy = ">=2.0"
alembic = "*"
pydantic = ">=2.0"
psycopg2-binary = "^2.9.10"
python-dotenv = "*"
redis = "*"
requests = "*"
aiohttp = "*"
python-logging-loki = "^0.3.1"
python-json-logger = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
mypy = "*"
