# to start redis server with config file:
# redis-server /path/to/your/redis.conf

# Memory management
maxmemory 2gb
maxmemory-policy volatile-lru

# Persistence for data safety
appendonly yes
appendfsync everysec  # Balance between performance and data safety

# Performance
timeout 300  # 5-minute connection timeout
tcp-keepalive 60  # Keep connections alive
