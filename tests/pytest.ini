[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    contract: marks tests as live contract tests (slow, requires network)
    e2e: marks tests as e2e test, to be run periodically (very slow, requires network and multiple setups)
    dependency: marks a test as part of a dependency chain
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
asyncio_mode = auto
filterwarnings =
    # This line tells pytest to ignore any RuntimeWarning where the message
    # matches the pattern "coroutine '...' was never awaited".
    ignore:coroutine '.*' was never awaited:RuntimeWarning
