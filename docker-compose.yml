services:
  # Infrastructure services
  db:
    image: postgres:14
    container_name: my-postgres
    env_file: ./.env.production
    ports:
      - "6000:5432"
    volumes:
      - psql:/var/lib/postgresql/data
    networks:
      - dota-pred
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  redis:
    image: redis:latest
    container_name: my-redis
    # Cap memory as a backstop (peak was ~148M). Keep noeviction: this is a work queue, so
    # evicting stream/PEL/status keys would corrupt pipeline state -- a full Redis should
    # reject writes (loud, recoverable), not silently drop data. Data is bounded by stream
    # MAXLEN + match_status TTLs, so we shouldn't reach the cap. RDB persistence (default)
    # keeps using the /data volume.
    command: redis-server --maxmemory 384mb --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis:/data
    networks:
      - dota-pred
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-web
    env_file: ./.env.production
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - dota-pred
      - shared-caddy-network
    depends_on:
      db:
        condition: service_healthy
        restart: true


  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    restart: always
    command: prefect server start --host 0.0.0.0
    mem_limit: 512m
    env_file: ./.env.production
    depends_on:
      db:
        condition: service_healthy
        restart: true
    volumes:
      - ~/.prefect/storage:/root/.prefect/storage
    networks:
      - dota-pred
      - shared-caddy-network

  # Frontend
  dota-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Default to production image (runner). Dev override targets the 'dev' stage.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: dota-frontend
    ports:
      - "3050:3000"
    env_file: ./.env.production
    depends_on:
      api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - dota-pred
      - shared-caddy-network

  # Microservices
  api-service:
    build:
      context: .
      dockerfile: ./services/api_service/Dockerfile
    container_name: api-service
    ports:
      - "8000:8000"
    env_file: ./.env.production
    environment:
      - SERVICE_NAME=api-service
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
      live-orchestrator-app:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - dota-pred
      - shared-caddy-network


  live-orchestrator-app:
    build:
      context: .
      dockerfile: ./live_orchestrator_app/Dockerfile
    container_name: live-orchestrator-app
    env_file: ./.env.production
    environment:
      - SERVICE_NAME=live-orchestrator
    depends_on:
      prefect-server:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - dota-pred

  dota-oracle-schedules:
    build:
      context: .
      dockerfile: ./dota_oracle_schedules/Dockerfile
    container_name: dota-oracle-schedules
    env_file: ./.env.production
    environment:
      - SERVICE_NAME=dota-oracle-schedules
    depends_on:
      prefect-server:
        condition: service_started
      db:
        condition: service_healthy
      loki:
        condition: service_healthy
    volumes:
      - ~/.prefect/storage:/root/.prefect/storage
    networks:
      - dota-pred

  bentoml:
    container_name: bentoml
    image: dota_prediction_service:latest
    ports:
      - "3333:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dota-pred


  # Logging and Observability
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dota-pred
    healthcheck:
      # Checks Loki's /ready endpoint to ensure it's ready to receive logs.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # Admin creds come from .env.production (GF_SECURITY_ADMIN_USER/PASSWORD). Without a
    # persistent volume Grafana resets its password, datasource and dashboards on every
    # recreate -- the volume + file provisioning below make the setup reproducible.
    env_file: ./.env.production
    ports:
      - "3001:3000"
    depends_on:
      - loki
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - dota-pred
      - shared-caddy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  dota-pred:
    driver: bridge
  shared-caddy-network:
    external: true

volumes:
  psql:
  redis:
  pgadmin-data:
  grafana-data:
  backend:    # Unused for now, but can be used later
