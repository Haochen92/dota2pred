services:
  db:
    image: postgres:14
    container_name: my-postgres
    environment:
      - POSTGRES_USER=liuhaochen
      - POSTGRES_PASSWORD=110799
      - POSTGRES_DB=dota2
    ports:
      - "6000:5432"
    volumes:
      - psql:/var/lib/postgresql/data
    networks:
      - dota-pred
  
  bentoml:
    container_name: model-server
    image: match_prediction:latest
    ports: 
      - "3333:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dota-pred
