services:
  # Infrastructure services
  db:
    image: postgres:14
    container_name: my-postgres
    environment:
      - POSTGRES_USER=liuhaochen
      - POSTGRES_PASSWORD=110799
      - POSTGRES_DB=dota2
    ports:
      - "6000:5432"
    volumes:
      - psql:/var/lib/postgresql/data
    networks:
      - dota-pred

  test-db:
    image: postgres:14
    container_name: db-test
    environment:
      - POSTGRES_USER=liuhaochen
      - POSTGRES_PASSWORD=110799
      - POSTGRES_DB=dota2
    ports:
      - "6006:5432"
    volumes:
      - psql-test:/var/lib/postgresql/data
    networks:
      - dota-pred

  redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - "6380:6379"
    volumes:
      - redis:/data
    networks:
      - dota-pred

  test-redis:
    image: redis:latest
    container_name: redis-test
    ports:
      - "6390:6379"
    volumes:
      - redis-test:/data
    networks:
      - dota-pred
    profiles:
      - test

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-web
    environment:
      - PGADMIN_DEFAULT_EMAIL=liu_hao_chen@hotmail.com
      - PGADMIN_DEFAULT_PASSWORD=Password12345!
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - dota-pred
    depends_on:
      - test-db

  # Microservices
  api-service:
    build:
      context: .
      dockerfile: ./services/api_service/Dockerfile
    container_name: api-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://liuhaochen:110799@db:5432/dota2
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
      - prediction-service
    networks:
      - dota-pred

  prediction-service:
    build:
      context: .
      dockerfile: ./services/prediction_service/Dockerfile
    container_name: prediction-service
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://liuhaochen:110799@db:5432/dota2
    depends_on:
      - db
    networks:
      - dota-pred

  live-orchestrator-app:
    build:
      context: .
      dockerfile: ./live_orchestrator_app/Dockerfile
    container_name: live-orchestrator-app
    environment:
      - DATABASE_URL=postgresql://liuhaochen:110799@db:5432/dota2
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    depends_on:
      - db
      - redis
    networks:
      - dota-pred

  # Logging and monitoring
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - dota-pred

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    depends_on:
      - loki
    networks:
      - dota-pred

networks:
  dota-pred:
    driver: bridge

volumes:
  psql:
  psql-test:
  redis:
  redis-test:
  pgadmin-data:
  backend:    # Unused for now, but can be used later
