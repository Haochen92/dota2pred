[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "training-pipeline"
version = "0.1.0"
description = "Model training pipeline for Dota Oracle"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]
packages = [{include = "training_pipeline", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
dota-oracle-common = {path = "../../packages/dota_oracle_common", develop = true}
dota-oracle-etl = {path = "../../packages/dota_oracle_etl", develop = true}
scikit-learn = "*"
bentoml = "*"
numpy = "*"
pandas = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
mypy = "*"