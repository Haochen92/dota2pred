[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "api-service"
version = "0.1.0"
description = "FastAPI gateway service for Dota Oracle"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]
packages = [{include = "api_service", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
dota-oracle-common = {path = "../../packages/dota_oracle_common", develop = true}
fastapi = "*"
uvicorn = "*"
pydantic = ">=2.0"
python-dotenv = "*"
httpx = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
mypy = "*"