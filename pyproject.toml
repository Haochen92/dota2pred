[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dota_oracle_root"
version = "0.1.0"
description = "A microservice monorepo for Dota 2 match predictions"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
boto3 = "^1.38.36"
boto3-stubs = {extras = ["s3"], version = "^1.38.36"}

# IMPORTANT: Test dependencies are now here
[tool.poetry.group.dev.dependencies]
# Common dev dependencies
pytest = "*"
pytest-mock = "*"
mypy = "*"
ruff = "*"
black = "*"
pre-commit = "*"

# Stubs
scipy-stubs = "^1.16.0.2"
pandas-stubs = "^2.3.0.250703"

# Dependencies from your tests/pyproject.toml
pytest-asyncio = "^0.26.0"
testcontainers = {extras = ["postgres", "redis"], version = "^4.10.0"}
httpx = "*"
requests = "*"
polyfactory = "^2.21.0"

[tool.poetry.group.workspace]
optional = false

[tool.poetry.group.workspace.dependencies]
# Local workspace packages (This is correct)
dota-oracle-common = {path = "packages/dota_oracle_common", develop = true}
dota-oracle-pipeline = {path = "packages/dota_oracle_pipeline", develop = true}
model-factory = {path = "model_factory", develop = true}
prediction-service = {path = "services/inference_service", develop = true}
live-orchestrator-app = {path = "live_orchestrator_app", develop = true}
api-service = {path = "services/api_service", develop = true}

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true # You had this right, keep it.

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
