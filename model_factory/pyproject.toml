[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "model-factory"
version = "0.1.0"
description = "Model training pipeline for Dota Oracle"
authors = ["liuhaochen <liu_hao_chen@hotmail.com>"]
packages = [{include = "model_factory", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
dota-oracle-common = {path = "../packages/dota_oracle_common", develop = true}
dota-oracle-pipeline = {path = "../packages/dota_oracle_pipeline", develop = true}
scikit-learn = "*"
bentoml = "*"
numpy = "*"
pandas = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-mock = "*"
mypy = "*"