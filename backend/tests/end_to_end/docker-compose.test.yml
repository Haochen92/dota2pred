services:
  db:
    image: postgres:14-alpine
    ports: ["5432"]
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
  redis:
    image: redis:7-alpine
    ports: ["6379"]
  bentoml:
    image: match_prediction:latest
    ports: ["3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3